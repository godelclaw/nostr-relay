name: Deploy relay

# Deploys a merged pull request's tag (pr-<number>, made by the Tag merged PR workflow) to
# omega-universe (the self-hosted runner there), checks https://$RELAY_DOMAIN/health, logs every
# run as a comment on the pinned issue "Deploy log" (label deploy-log), and, after a healthy
# deploy, publishes the deployed tag as a badge (deployed.json on the badges branch) from a second
# job on GitHub's runners, so no write token ever sits on the server. The tag is typed into the
# Run workflow dialog (input "ref"); the dialog stays on main, so this file always runs from main,
# which only a merged pull request changes. Only a pr-* tag whose commit is on main is accepted:
# no branch, no sha; a dispatch from any ref but main is refused in Preflight, before any docker
# step. Rollback is this same workflow dispatched with the previous tag, which the Deploy log
# names. This workflow runs on dispatch only, never on a tag push. It cannot by itself keep other
# workflow files off the runner: a branch brings its own, and so does a pull request from a fork
# (the repository is public), whose run goes ahead unless held for approval (GitHub's default
# holds first-time contributors only). The fence is part of the setup: the runner group pinned to
# this file on main (so no other workflow file reaches the runner), and the repository requiring
# approval for all outside collaborators (Settings -> Actions -> General); see issue #2.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "The pr-<number> tag of a merged pull request (made by the Tag merged PR workflow). No default: name the tag. Rollback: the previous tag as the Deploy log issue shows it."
        required: true

concurrency:
  group: relay-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, omega-universe]
    permissions:
      contents: read
      issues: write
    env:
      RELAY_DOMAIN: ${{ vars.RELAY_DOMAIN }}
      REF: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Preflight
        id: preflight
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # only a pr-<number> tag, and only if its commit is on main: a merged pull request
          # this file must be main's: the dispatch dialog offers other branches, and a branch could carry another deploy.yml
          [ "$GITHUB_REF_NAME" = main ] || { echo "::error::run this workflow from main, not from '$GITHUB_REF_NAME'; the tag goes in the ref input" >&2; exit 1; }
          n=${REF#pr-}
          case "$REF" in pr-[1-9]*) case "$n" in *[!0-9]*) n= ;; esac ;; *) n= ;; esac
          [ -n "$n" ] || { echo "::error::ref must be a pr-<number> tag (got '$REF'); the Tag merged PR workflow makes one per merged pull request" >&2; exit 1; }
          tagsha=$(git rev-parse -q --verify "refs/tags/$REF^{commit}" || true)
          [ -n "$tagsha" ] || { echo "::error::no tag $REF in this repository" >&2; exit 1; }
          [ "$tagsha" = "$(git rev-parse HEAD)" ] || { echo "::error::checkout is at $(git rev-parse HEAD), tag $REF is at $tagsha" >&2; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::tag $REF's commit is not on main" >&2; exit 1; }
          [ -n "$RELAY_DOMAIN" ] || { echo "::error::repository variable RELAY_DOMAIN is not set" >&2; exit 1; }
          docker --version
          docker compose version
          echo "tag $REF is $(git rev-parse HEAD), on main"

      - name: Record the previous state
        id: previous
        run: |
          set -euo pipefail
          state="${HOME:-$(getent passwd "$(id -u)" | cut -d: -f6)}/relay"
          mkdir -p "$state"
          # DEPLOYED holds "<tag> <sha>" (a one-field file from before tags holds the sha only)
          read -r prevtag prevsha < "$state/DEPLOYED" 2>/dev/null || true
          if [ -z "${prevtag:-}" ]; then prev=none
          elif [ -z "${prevsha:-}" ]; then prev="\`$prevtag\`"; prevtag=
          else prev="\`$prevtag\` (\`$prevsha\`)"
          fi
          echo "desc=$prev" >> "$GITHUB_OUTPUT"
          echo "tag=${prevtag:-}" >> "$GITHUB_OUTPUT"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "previously deployed: $prev"
          docker compose -p nostr-relay -f docker-compose.yml -f docker-compose.public.yml ps || true

      - name: Deploy at the tag
        id: deploy
        run: |
          set -euo pipefail
          echo "deploying $(git rev-parse HEAD) (tag $REF) to https://$RELAY_DOMAIN"
          # --force-recreate: config.toml and Caddyfile are bind-mounted from this checkout; a checkout
          # replaces the files (new inode), which a running container's mount does not follow.
          docker compose -p nostr-relay -f docker-compose.yml -f docker-compose.public.yml \
            up -d --build --force-recreate --remove-orphans

      - name: Health check
        id: health
        run: |
          set -euo pipefail
          # up to 2 minutes by the clock: the first deploy on a host waits for Caddy's certificate.
          # Healthy means a 2xx answer; curl -f alone would also accept a redirect from something
          # else answering on the domain.
          end=$((SECONDS + 120))
          while [ "$SECONDS" -lt "$end" ]; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://$RELAY_DOMAIN/health" || true)
            case "$code" in
              2??) echo "healthy (HTTP $code) after ${SECONDS}s"; exit 0 ;;
            esac
            sleep 5
          done
          echo "::error::https://$RELAY_DOMAIN/health did not answer 2xx within 2 minutes (last: HTTP ${code:-none}); containers left as they are"
          docker compose -p nostr-relay -f docker-compose.yml -f docker-compose.public.yml logs --tail 50
          exit 1

      - name: Mark as deployed
        env:
          STATE: ${{ steps.previous.outputs.state }}
        run: |
          set -euo pipefail
          echo "$REF $(git rev-parse HEAD)" > "$STATE/DEPLOYED"
          echo "DEPLOYED = $(cat "$STATE/DEPLOYED")"

      - name: Log the run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.preflight.outputs.sha }}
          PREVIOUS: ${{ steps.previous.outputs.desc }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
          DEPLOY: ${{ steps.deploy.outcome }}
          HEALTH: ${{ steps.health.outcome }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # from Preflight, not from the workspace: on a self-hosted runner a failed checkout leaves
          # the previous run's HEAD in place
          sha="${SHA:-unknown}"
          gh label create deploy-log --description "the relay deploy's run log" --color 0075CA --force -R "$GITHUB_REPOSITORY"
          log=$(gh issue list -R "$GITHUB_REPOSITORY" --label deploy-log --state open --json number --jq '.[0].number // empty')
          if [ -z "$log" ]; then
            log=$(gh issue create -R "$GITHUB_REPOSITORY" --title "Deploy log" --label deploy-log \
              --body "One comment per run of the Deploy relay workflow: date, tag and commit deployed, the tag it replaced, result, link to the run. Failed runs are logged too. To roll back, run the workflow with the previous tag as the ref." | grep -oE '[0-9]+$')
            gh issue pin "$log" -R "$GITHUB_REPOSITORY" || echo "::warning::could not pin the Deploy log issue; pin it by hand"
          fi
          when=$(date -u +'%Y-%m-%d %H:%M UTC')
          # PREVIOUS is empty when checkout or Preflight failed (the step was skipped); the file still
          # holds the last deploy, since "Mark as deployed" was skipped too
          prev="$PREVIOUS"; prevtag="$PREVIOUS_TAG"
          if [ -z "$prev" ]; then
            read -r prevtag prevsha < "$HOME/relay/DEPLOYED" 2>/dev/null || true
            if [ -z "${prevtag:-}" ]; then prev=none
            elif [ -z "${prevsha:-}" ]; then prev="\`$prevtag\`"; prevtag=
            else prev="\`$prevtag\` (\`$prevsha\`)"
            fi
          fi
          this="\`$REF\` (\`$sha\`)"
          if [ "$HEALTH" = success ]; then
            line="$when: deployed $this, replacing $prev: healthy"
          elif [ "$DEPLOY" = failure ]; then
            line="$when: deploy of $this FAILED in docker compose; $prev stays the recorded deploy; see the run"
          elif [ "$HEALTH" = failure ]; then
            if [ "$prev" = none ]; then
              line="$when: deployed $this but https://$RELAY_DOMAIN/health did not answer; containers left as they are; nothing was deployed before, so deploy a fixed tag or stop the containers by hand"
            elif [ -n "$prevtag" ]; then
              line="$when: deployed $this but https://$RELAY_DOMAIN/health did not answer; containers left as they are; roll back by running the workflow with ref \`$prevtag\`"
            else
              line="$when: deployed $this but https://$RELAY_DOMAIN/health did not answer; containers left as they are; the previous deploy $prev predates tags: find its pull request's tag in this log and deploy that"
            fi
          else
            line="$when: run for $this did not finish (cancelled, or an earlier step failed); $prev stays the recorded deploy; see the run"
          fi
          gh issue comment "$log" -R "$GITHUB_REPOSITORY" --body "$line ([run]($run_url))"

  badge:
    # Runs only after a healthy deploy (the deploy job fails otherwise). On GitHub's runners with
    # its own write token: the self-hosted job never holds one. Writes deployed.json on the badges
    # branch, in shields.io's endpoint format; the README's "deployed" badge reads it. A failure
    # here does not undo the deploy, so it only warns.
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REF: ${{ inputs.ref }}
    steps:
      - name: Publish the deployed badge
        run: |
          set -euo pipefail
          json=$(printf '{"schemaVersion":1,"label":"deployed","message":"%s","color":"blue","cacheSeconds":300}' "$REF")
          b64=$(printf '%s' "$json" | base64 | tr -d '\n')
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/badges" >/dev/null 2>&1; then
            # a missing file makes gh print its error JSON to stdout and exit 1, so test the exit
            sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/deployed.json?ref=badges" --jq .sha 2>/dev/null) || sha=
            if [ -n "$sha" ]; then
              gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/deployed.json" -f branch=badges -f message="deployed $REF" -f content="$b64" -f sha="$sha" >/dev/null
            else
              gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/deployed.json" -f branch=badges -f message="deployed $REF" -f content="$b64" >/dev/null
            fi
          else
            # first deploy: the badges branch is an orphan with this one file
            blob=$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/blobs" -f content="$b64" -f encoding=base64 --jq .sha)
            tree=$(printf '{"tree":[{"path":"deployed.json","mode":"100644","type":"blob","sha":"%s"}]}' "$blob" \
              | gh api -X POST "repos/$GITHUB_REPOSITORY/git/trees" --input - --jq .sha)
            commit=$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/commits" -f message="deployed $REF" -f tree="$tree" --jq .sha)
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/badges -f sha="$commit" >/dev/null
          fi
          echo "badge: deployed $REF"
