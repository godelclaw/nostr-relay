name: Deploy relay

# Deploys this repository at a chosen ref to omega-universe (the self-hosted runner there),
# checks https://$RELAY_DOMAIN/health, and logs every run as a comment on the pinned issue
# "Deploy log" (label deploy-log). Rollback is this same workflow dispatched with the previous
# commit's sha, which the Deploy log names. This workflow runs on dispatch only, but it cannot keep
# other workflows off the runner: a pull request from a fork brings its own workflow files. That
# fence is part of the setup: register the runner in a runner group open to this repository only,
# limited to this workflow on main where GitHub's plan allows it, and require approval for
# workflows from fork pull requests (Settings -> Actions -> General).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or the full 40-character commit sha to deploy (a short sha is looked up as a branch and fails). Rollback: the previous sha as the Deploy log issue shows it."
        required: true
        default: main

permissions:
  contents: read
  issues: write

concurrency:
  group: relay-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, omega-universe]
    env:
      RELAY_DOMAIN: ${{ vars.RELAY_DOMAIN }}
      REF: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Preflight
        id: preflight
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          [ -n "$RELAY_DOMAIN" ] || { echo "::error::repository variable RELAY_DOMAIN is not set" >&2; exit 1; }
          docker --version
          docker compose version
          echo "ref $REF is $(git rev-parse HEAD)"

      - name: Record the previous state
        id: previous
        run: |
          set -euo pipefail
          state="${HOME:-$(getent passwd "$(id -u)" | cut -d: -f6)}/relay"
          mkdir -p "$state"
          prev=$(cat "$state/DEPLOYED" 2>/dev/null || echo none)
          echo "sha=$prev" >> "$GITHUB_OUTPUT"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "previously deployed: $prev"
          docker compose -p nostr-relay -f docker-compose.yml -f docker-compose.public.yml ps || true

      - name: Deploy at the ref
        id: deploy
        run: |
          set -euo pipefail
          echo "deploying $(git rev-parse HEAD) (ref $REF) to https://$RELAY_DOMAIN"
          # --force-recreate: config.toml and Caddyfile are bind-mounted from this checkout; a checkout
          # replaces the files (new inode), which a running container's mount does not follow.
          docker compose -p nostr-relay -f docker-compose.yml -f docker-compose.public.yml \
            up -d --build --force-recreate --remove-orphans

      - name: Health check
        id: health
        run: |
          set -euo pipefail
          # up to 2 minutes by the clock: the first deploy on a host waits for Caddy's certificate.
          # Healthy means a 2xx answer; curl -f alone would also accept a redirect from something
          # else answering on the domain.
          end=$((SECONDS + 120))
          while [ "$SECONDS" -lt "$end" ]; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://$RELAY_DOMAIN/health" || true)
            case "$code" in
              2??) echo "healthy (HTTP $code) after ${SECONDS}s"; exit 0 ;;
            esac
            sleep 5
          done
          echo "::error::https://$RELAY_DOMAIN/health did not answer 2xx within 2 minutes (last: HTTP ${code:-none}); containers left as they are"
          docker compose -p nostr-relay -f docker-compose.yml -f docker-compose.public.yml logs --tail 50
          exit 1

      - name: Mark as deployed
        env:
          STATE: ${{ steps.previous.outputs.state }}
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$STATE/DEPLOYED"
          echo "DEPLOYED = $(cat "$STATE/DEPLOYED")"

      - name: Log the run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.preflight.outputs.sha }}
          PREVIOUS: ${{ steps.previous.outputs.sha }}
          DEPLOY: ${{ steps.deploy.outcome }}
          HEALTH: ${{ steps.health.outcome }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # from Preflight, not from the workspace: on a self-hosted runner a failed checkout leaves
          # the previous run's HEAD in place
          sha="${SHA:-unknown}"
          gh label create deploy-log --description "the relay deploy's run log" --color 0075CA --force -R "$GITHUB_REPOSITORY"
          log=$(gh issue list -R "$GITHUB_REPOSITORY" --label deploy-log --state open --json number --jq '.[0].number // empty')
          if [ -z "$log" ]; then
            log=$(gh issue create -R "$GITHUB_REPOSITORY" --title "Deploy log" --label deploy-log \
              --body "One comment per run of the Deploy relay workflow: date, ref and commit deployed, the commit it replaced, result, link to the run. Failed runs are logged too. To roll back, run the workflow with the previous commit's sha as the ref." | grep -oE '[0-9]+$')
            gh issue pin "$log" -R "$GITHUB_REPOSITORY" || echo "::warning::could not pin the Deploy log issue; pin it by hand"
          fi
          when=$(date -u +'%Y-%m-%d %H:%M UTC')
          # PREVIOUS is empty when checkout or Preflight failed (the step was skipped); the file still
          # holds the last deploy, since "Mark as deployed" was skipped too
          prev="${PREVIOUS:-$(cat "$HOME/relay/DEPLOYED" 2>/dev/null || echo none)}"
          if [ "$HEALTH" = success ]; then
            line="$when: deployed \`$sha\` (ref \`$REF\`), replacing \`$prev\`: healthy"
          elif [ "$DEPLOY" = failure ]; then
            line="$when: deploy of \`$sha\` (ref \`$REF\`) FAILED in docker compose; \`$prev\` stays the recorded deploy; see the run"
          elif [ "$HEALTH" = failure ]; then
            if [ "$prev" = none ]; then
              line="$when: deployed \`$sha\` (ref \`$REF\`) but https://$RELAY_DOMAIN/health did not answer; containers left as they are; nothing was deployed before, so deploy a fixed ref or stop the containers by hand"
            else
              line="$when: deployed \`$sha\` (ref \`$REF\`) but https://$RELAY_DOMAIN/health did not answer; containers left as they are; roll back by running the workflow with ref \`$prev\`"
            fi
          else
            line="$when: run for \`$sha\` (ref \`$REF\`) did not finish (cancelled, or an earlier step failed); \`$prev\` stays the recorded deploy; see the run"
          fi
          gh issue comment "$log" -R "$GITHUB_REPOSITORY" --body "$line ([run]($run_url))"
